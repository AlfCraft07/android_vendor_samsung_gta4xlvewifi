name: Build vendor.img

on:
  push:
    branches:
      - P613XXS8FZI4
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout vendor repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils

      - name: Build vendor.img
        run: |
          chmod +x ./build.sh
          ./build.sh out erofs

      - name: Checksum vendor.img
        run: |
          sha256sum out/vendor.img | tee out/vendor.img.sha256

      - name: Upload vendor.img
        uses: actions/upload-artifact@v4
        with:
          name: vendor-img-${{ github.sha }}
          path: |
            out/vendor.img
            out/vendor.img.sha256
          if-no-files-found: error
          retention-days: 14
